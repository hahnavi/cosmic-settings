[workspace]
members = ["cosmic-settings", "page", "pages/*", "subscriptions/*"]
default-members = ["cosmic-settings"]
resolver = "3"

[workspace.package]
rust-version = "1.99"

[workspace.dependencies]
cosmic-randr = { git = "https://github.com/pop-os/cosmic-randr" }
tokio = { version = "1.53.2", features = ["macros"] }
iced_winit = { git = "https://github.com/hahnavi/libcosmic", branch = "hahnavi", default-features = false }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
    "rayon",
    "webp",
    "hdr",
] }

[workspace.dependencies.libcosmic]
features = [
    "dbus-config",
    "desktop",
    "multi-window",
    "winit",
    "tokio",
    "qr_code",
]
git = "https://github.com/hahnavi/libcosmic"
branch = "hahnavi"

[workspace.dependencies.cosmic-config]
git = "https://github.com/hahnavi/libcosmic"
branch = "hahnavi"

[workspace.dependencies.cosmic-bg-config]
git = "https://github.com/hahnavi/cosmic-bg"
branch = "hahnavi"

[workspace.dependencies.cosmic-comp-config]
git = "https://github.com/hahnavi/cosmic-comp"
branch = "hahnavi"
features = ["output"]

[workspace.dependencies.cosmic-idle-config]
git = "https://github.com/pop-os/cosmic-idle"

[workspace.dependencies.cosmic-panel-config]
git = "https://github.com/hahnavi/cosmic-panel"
branch = "hahnavi"

[workspace.dependencies.cosmic-randr-shell]
git = "https://github.com/pop-os/cosmic-randr"

[workspace.dependencies.sctk]
version = "0.21.1"
package = "smithay-client-toolkit"

[profile.dev]
opt-level = 3
lto = "off"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

[profile.release-with-debug]
inherits = "release"
lto = "off"
debug = true

